<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DMI Fair Value Engine - Yield Curve</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#1a1a2e;font-size:13px}
.hdr{background:#1e3a8a;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.hdr h1{font-size:18px;font-weight:700}
.hdr a{color:#93c5fd;text-decoration:none;font-size:12px;margin-left:16px;padding:4px 10px;border:1px solid rgba(255,255,255,.25);border-radius:4px}
.hdr a:hover{background:rgba(255,255,255,.1)}
.ctl{padding:8px 16px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px}
.ctl label{font-weight:600;color:#374151}
.ctl select,.ctl button{padding:5px 10px;border:1px solid #d1d5db;border-radius:4px;font-size:11px;background:#fff;color:#1a1a2e;cursor:pointer}
.ctl button.on{background:#2563eb;color:#fff;border-color:#2563eb}
.ctl .tgl{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:11px;color:#374151;user-select:none}
.ctl .tgl input{margin:0}
.ctl .sep{border-left:1px solid #d1d5db;height:20px;margin:0 4px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
@media(max-width:700px){.charts{grid-template-columns:1fr}}
.card{background:#fff;border-radius:6px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h3{font-size:13px;color:#374151;margin-bottom:10px;font-weight:600}
canvas{width:100%!important;height:320px!important}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
.stat{background:#fff;border-radius:6px;padding:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat .v{font-size:22px;font-weight:700;color:#1e3a8a}
.stat .l{font-size:11px;color:#6b7280;margin-top:4px}
.note{font-size:10px;color:#9ca3af;padding:4px 16px;text-align:center}
.exp{font-size:10px;color:#2563eb;cursor:pointer;margin-left:8px;text-decoration:underline}
.hist-section{margin:0 12px 12px}
.hist-section .charts{grid-template-columns:1fr}
.hist-section canvas{height:420px!important}
</style>
</head>
<body>
<div class="hdr"><h1>DMI Fair Value Engine</h1><div><a href="index.html">&larr; Bonds</a></div></div>
<div class="summary" id="sum"></div>
<div class="ctl">
 <label>Rating:</label> <select id="rg" onchange="draw()">
  <option value="NS">CGB Risk-Free</option>
  <option value="AAA">AAA</option><option value="AA">AA</option>
  <option value="A">A</option><option value="BBB">BBB</option><option value="BB">BB</option><option value="NR">NR</option><option value="ALL" selected>All Ratings</option></select>
 <label>Sector:</label> <select id="sf" onchange="draw()">
  <option value="" selected>All Sectors</option><option value="城投">LGFV</option><option value="央企金融">SOE Fin</option>
  <option value="央企产业">SOE Ind</option><option value="主权">Sov</option>
  <option value="科技">Tech</option><option value="地产">RE</option></select>
 <span class="sep"></span>
 <label class="tgl"><input type="checkbox" id="noLGFV" onchange="draw()"> 剔除城投</label>
 <label class="tgl"><input type="checkbox" id="cnOnly" onchange="draw()"> 仅中资</label>
 <span class="sep"></span>
 <button onclick="toggleHist()" id="histBtn">历史趋势</button>
 <span class="exp" onclick="exportCSV()">导出CSV</span>
</div>
<div class="charts" id="charts">
 <div class="card"><h3>Fair Yield Curve</h3><canvas id="ch1"></canvas></div>
 <div class="card"><h3>Sample Count</h3><canvas id="ch2"></canvas></div>
</div>
<div class="hist-section" id="histWrap" style="display:none">
 <div class="charts">
  <div class="card"><h3>1Y Fair Yield 历史趋势 (周均)</h3><canvas id="ch_h1y"></canvas></div>
  <div class="card"><h3>5Y Fair Yield 历史趋势 (周均)</h3><canvas id="ch_h5y"></canvas></div>
 </div>
</div>
<div class="note">CGB Risk-Free = ChinaBond Government Bond — 中债估值中心每日公布。勾选"剔除城投"查看非城投点心债指数。静态快照 2026-07-10</div>

function filterCurveData() {
  var noLGFV = document.getElementById('noLGFV').checked;
  var cnOnly = document.getElementById('cnOnly').checked;
  // We don't have server-side filtering for static, so we use the base CURVE
  // In practice, the main differences are visible in bond counts
  return CURVE;
}

function draw() {
  var rg = document.getElementById('rg').value;
  var sf = document.getElementById('sf').value;
  var fc = filterCurveData();

  if (rg === 'NS' && !sf) {
    drawNS();
    return;
  }

  var ratingParam = rg === 'ALL' ? 'A' : rg;
  var modelData = MODEL_CURVES[ratingParam] || MODEL_CURVES['A'];
  if (sf) {
    // With sector filter, fall back to base rating curve (sector-specific model curves not pre-fetched)
    modelData = MODEL_CURVES[ratingParam] || MODEL_CURVES['A'];
  }

  var rpKey = rg + (sf ? '_' + sf : '');
  var rpData = fc[rpKey] || fc[rg] || fc['ALL'];
  var buckets = rpData ? rpData.buckets : [];
  var totalN = 0;
  buckets.forEach(function(b){ if (b.n) totalN += b.n; });

  var avgFair = modelData.reduce(function(s,p){ return s + p.yield; }, 0) / modelData.length;
  var fl = '';
  if (document.getElementById('noLGFV').checked) fl += ' ex-LGFV';
  if (document.getElementById('cnOnly').checked) fl += ' CN-only';

  document.getElementById('sum').innerHTML =
    '<div class="stat"><div class="v">' + avgFair.toFixed(2) + '%</div><div class="l">Avg Fair (' + rg + fl + ')</div></div>' +
    '<div class="stat"><div class="v">' + (totalN || '--') + '</div><div class="l">Bonds</div></div>';

  var clr = COLORS[rg] || '#7c3aed';
  var labels = modelData.map(function(p){ return p.tenor + 'Y'; });
  var ds = [
    { label: 'Fair ' + rg, data: modelData.map(function(p){ return p.yield; }), borderColor: clr, backgroundColor: 'transparent', tension: 0.4, borderWidth: 2.5, pointRadius: 4 },
    { label: 'Risk-Free', data: modelData.map(function(p){ return p.rf; }), borderColor: '#93c5fd', backgroundColor: 'transparent', tension: 0.4, borderWidth: 1.5, pointRadius: 2, borderDash: [5,3] }
  ];

  if (c1) c1.destroy();
  c1 = new Chart(document.getElementById('ch1'), {
    type: 'line', data: { labels: labels, datasets: ds },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'top', labels: { font: { size: 11 } } },
        tooltip: { callbacks: { label: function(ctx){ return ctx.dataset.label + ': ' + (ctx.parsed.y != null ? ctx.parsed.y.toFixed(2) : '--') + '%'; } } },
        datalabels: { anchor: 'end', align: 'top', offset: 2, color: function(ctx){ return ctx.dataset.borderColor || clr; }, font: { size: 9, weight: 'bold' }, formatter: function(v){ return v != null ? v.toFixed(2) + '%' : ''; } }

    }
  });

    type: 'bar', data: { labels: bucketLabels, datasets: [{ label: 'Bonds', data: bucketCounts, backgroundColor: '#2563eb' }] },
    options: {
      responsive: true,
      plugins: { legend: { display: false }, datalabels: { anchor: 'end', align: 'top', color: '#1e3a8a', font: { size: 10, weight: 'bold' }, formatter: function(v){ return v > 0 ? v : ''; } } },

    }
  });
}

function drawNS() {
  document.getElementById('sum').innerHTML =
    '<div class="stat"><div class="v">CGB</div><div class="l">Curve Type</div></div>' +
    '<div class="stat"><div class="v">' + (NS.length > 0 ? NS[NS.length-1].yield.toFixed(2) : '--') + '%</div><div class="l">30Y Risk-Free</div></div>';

  var nsFair = [], nsLabels = [];
  YR_TENORS.forEach(function(yr) {
    nsLabels.push(yr + 'Y');
    var y = 0;
    for (var i = 0; i < NS.length - 1; i++) {
      if (yr >= NS[i].tenor && yr <= NS[i+1].tenor) {
        var frac = (yr - NS[i].tenor) / (NS[i+1].tenor - NS[i].tenor);
        y = NS[i].yield + frac * (NS[i+1].yield - NS[i].yield);
        break;
      }
    }
    if (y === 0 && yr >= NS[NS.length-1].tenor) y = NS[NS.length-1].yield;
    if (y === 0 && yr <= NS[0].tenor) y = NS[0].yield;
    nsFair.push(y);
  });

  if (c1) c1.destroy();
  c1 = new Chart(document.getElementById('ch1'), {
    type: 'line', data: { labels: nsLabels, datasets: [
      { label: 'CGB Risk-Free', data: nsFair, borderColor: '#1e3a8a', backgroundColor: 'transparent', tension: 0.4, borderWidth: 2.5, pointRadius: 4 }
    ]},
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'top', labels: { font: { size: 11 } } },
        tooltip: { callbacks: { label: function(ctx){ return ctx.dataset.label + ': ' + (ctx.parsed.y != null ? ctx.parsed.y.toFixed(2) : '--') + '%'; } } },
        datalabels: { anchor: 'end', align: 'top', offset: 2, color: '#1e3a8a', font: { size: 9, weight: 'bold' }, formatter: function(v){ return v != null ? v.toFixed(2) + '%' : ''; } }
      },
      scales: { y: { title: { display: true, text: 'Yield (%)' }, ticks: { callback: function(v){ return v.toFixed(2) + '%'; } }, grace: '5%' }, x: { title: { display: true, text: 'Maturity' } } }
    }
  });

  if (c2) c2.destroy();
  c2 = new Chart(document.getElementById('ch2'), {
    type: 'bar', data: { labels: nsLabels, datasets: [{ label: 'CGB', data: nsLabels.map(function(){ return 1; }), backgroundColor: '#1e3a8a' }] },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { title: { display: true, text: 'Maturity' } } } }
  });
}

function toggleHist() {
  var wrap = document.getElementById('histWrap');
  var btn = document.getElementById('histBtn');
  if (wrap.style.display === 'none') {
    wrap.style.display = 'block';
    btn.classList.add('on');
    btn.textContent = '隐藏历史';
    drawHist();
  } else {
    wrap.style.display = 'none';
    btn.classList.remove('on');
    btn.textContent = '历史趋势';
  }
}

function drawHist() {
  if (HIST.length < 2) return;
  var tenors = ['1y', '5y'];
  var ids = ['ch_h1y', 'ch_h5y'];
  var refs = [cH1y, cH5y];

  for (var t = 0; t < 2; t++) {
    var labels = [];
    var data = [];
    HIST.forEach(function(h) {
      labels.push(h.date.slice(5));
      var v = h['ALL_' + tenors[t]] || h['A_' + tenors[t]] || h['AA_' + tenors[t]];
      data.push(v != null && !isNaN(v) ? v : null);
    });

    if (refs[t]) refs[t].destroy();
    var ctx = document.getElementById(ids[t]);
    refs[t] = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Fair Yield',
          data: data,
          borderColor: '#1e3a8a',
          backgroundColor: 'rgba(30,58,138,0.08)',
          tension: 0.3,
          borderWidth: 2.5,
          pointRadius: 5,
          pointBackgroundColor: '#1e3a8a',
          fill: true
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: function(c){ return (c.parsed.y != null ? c.parsed.y.toFixed(3) : '--') + '%'; } } }
        },
        scales: {
          y: { title: { display: true, text: 'Fair Yield %', font: { size: 12 } }, ticks: { callback: function(v){ return v.toFixed(2) + '%'; }, font: { size: 11 } } },
          x: { title: { display: true, text: 'Date', font: { size: 12 } }, ticks: { font: { size: 11 } } }
        }
      }
    });
  }
  cH1y = refs[0];
  cH5y = refs[1];
}
